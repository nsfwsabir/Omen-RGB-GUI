<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff0000"/>
      <stop offset="25%" style="stop-color:#ff8000"/>
      <stop offset="50%" style="stop-color:#00ff00"/>
      <stop offset="75%" style="stop-color:#0080ff"/>
      <stop offset="100%" style="stop-color:#ff00ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bg)" stroke="#2a2a40" stroke-width="2"/>
  <!-- keyboard base -->
  <rect x="32" y="88" width="192" height="96" rx="12" fill="#0f0f1a" stroke="#333" stroke-width="2"/>
  <!-- 4 zones -->
  <rect x="40" y="102" width="42" height="28" rx="6" fill="#ff2a2a" filter="url(#glow)" opacity="0.95"/>
  <rect x="88" y="102" width="42" height="28" rx="6" fill="#2aff6a" filter="url(#glow)" opacity="0.95"/>
  <rect x="136" y="102" width="42" height="28" rx="6" fill="#2a7fff" filter="url(#glow)" opacity="0.95"/>
  <rect x="184" y="102" width="32" height="28" rx="6" fill="#ff2aff" filter="url(#glow)" opacity="0.95"/>
  <!-- second row keys faint -->
  <rect x="40" y="138" width="176" height="14" rx="4" fill="none" stroke="#444" stroke-width="1.2" stroke-dasharray="6 3" opacity="0.6"/>
  <rect x="40" y="158" width="176" height="10" rx="3" fill="#1e1e2a" stroke="#333"/>
  <!-- OMEN text -->
  <text x="128" y="200" font-family="monospace" font-size="22" font-weight="700" fill="white" text-anchor="middle" letter-spacing="4">OMEN</text>
  <text x="128" y="218" font-family="monospace" font-size="9" fill="#888" text-anchor="middle" letter-spacing="3">RGB • FAN • MUTE</text>
  <!-- top accent line rainbow -->
  <rect x="32" y="78" width="192" height="4" rx="2" fill="url(#rainbow)"/>
</svg>
